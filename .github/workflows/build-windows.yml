name: Build ApexDroid (Windows x64)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable and installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Tauri application icons
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/icon.svg --output src-tauri/icons

      - name: Build ApexDroid
        run: npx --yes @tauri-apps/cli build

      - name: Stage executable and installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null

          $appExe = "src-tauri/target/release/apexdroid-desktop.exe"
          if (!(Test-Path $appExe)) {
            throw "Build completed without the expected executable: $appExe"
          }

          Copy-Item $appExe "artifacts/ApexDroid.exe" -Force

          $nsisDir = "src-tauri/target/release/bundle/nsis"
          if (Test-Path $nsisDir) {
            Get-ChildItem $nsisDir -Filter "*.exe" -File | Copy-Item -Destination "artifacts" -Force
          }

          $msiDir = "src-tauri/target/release/bundle/msi"
          if (Test-Path $msiDir) {
            Get-ChildItem $msiDir -Filter "*.msi" -File | Copy-Item -Destination "artifacts" -Force
          }

          Get-ChildItem "artifacts" -File | Select-Object Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ApexDroid-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
