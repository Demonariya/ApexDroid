name: Build and Package ApexDroid (Windows x64)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest
    permissions:
      contents: write # Needed for creating GitHub Releases when a version tag is pushed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify package-lock.json & clean dependency installation
        run: |
          npm ci

      - name: Typecheck & lint frontend
        run: |
          npm run typecheck

      - name: Run frontend production build
        run: |
          npm run build

      - name: Run Rust unit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Tauri native desktop executable & bundle installers
        run: |
          npx tauri build --verbose

      - name: Verify and stage build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          $exePath = "src-tauri/target/release/apexdroid-desktop.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "CRITICAL: Expected executable not found at $exePath"
            exit 1
          }

          $exeItem = Get-Item $exePath
          if ($exeItem.Length -le 1000) {
            Write-Error "CRITICAL: Generated executable is empty or suspiciously small: $($exeItem.Length) bytes"
            exit 1
          }

          Write-Host "Verified valid executable: $exePath ($($exeItem.Length) bytes)"
          Copy-Item -Path $exePath -Destination "artifacts/ApexDroid.exe" -Force

          # Stage NSIS installer if generated
          $nsisFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $nsisFiles) {
            Write-Host "Found NSIS installer: $($file.FullName) ($($file.Length) bytes)"
            Copy-Item -Path $file.FullName -Destination "artifacts/$($file.Name)" -Force
          }

          # Stage MSI installer if generated
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $msiFiles) {
            Write-Host "Found MSI installer: $($file.FullName) ($($file.Length) bytes)"
            Copy-Item -Path $file.FullName -Destination "artifacts/$($file.Name)" -Force
          }

          Get-ChildItem -Path artifacts

      - name: Upload Windows x64 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexDroid-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release for Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
