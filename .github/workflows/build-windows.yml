name: Build and Package ApexDroid (Windows x64)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest
    permissions:
      contents: write # Needed for creating GitHub Releases when a version tag is pushed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify package-lock.json & clean dependency installation
        run: |
          npm ci --include=optional

      - name: Ensure Windows native build tools & native bindings
        shell: pwsh
        run: |
          $nativePackages = @(
            @{ Name = "@rolldown/binding-win32-x64-msvc"; Version = "1.2.12"; Path = "node_modules/@rolldown/binding-win32-x64-msvc" },
            @{ Name = "lightningcss-win32-x64-msvc"; Version = "1.32.0"; Path = "node_modules/lightningcss-win32-x64-msvc" },
            @{ Name = "@tailwindcss/oxide-win32-x64-msvc"; Version = "4.3.3"; Path = "node_modules/@tailwindcss/oxide-win32-x64-msvc" }
          )
          foreach ($pkg in $nativePackages) {
            if (-not (Test-Path $pkg.Path)) {
              Write-Host "Warning: $($pkg.Name) missing after npm ci, installing explicitly..."
              npm install --no-save "$($pkg.Name)@$($pkg.Version)"
            } else {
              Write-Host "Verified $($pkg.Name) is present."
            }
          }

          # Ensure nested @tailwindcss/node lightningcss directory has direct access to the binary fallback
          $nestedLightning = "node_modules/@tailwindcss/node/node_modules/lightningcss"
          if (Test-Path $nestedLightning) {
            $srcNode = "node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node"
            if (Test-Path $srcNode) {
              Copy-Item -Path $srcNode -Destination "$nestedLightning/lightningcss.win32-x64-msvc.node" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Typecheck & lint frontend
        run: |
          npm run typecheck

      - name: Run frontend production build
        run: |
          npm run build

      - name: Update Rust crates to latest compatible releases
        run: |
          cargo update --manifest-path src-tauri/Cargo.toml

      - name: Run Rust unit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Generate all required Tauri icons from SVG
        run: |
          npm run tauri -- icon src-tauri/icons/icon.svg

      - name: Setup Windows packaging dependencies (WiX for MSI installer)
        shell: pwsh
        run: |
          # WiX Toolset is required by Tauri to bundle .msi packages on Windows
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixLocations = @(
              "C:\Program Files (x86)\WiX Toolset v3.11\bin",
              "C:\Program Files\WiX Toolset v3.11\bin",
              "C:\Program Files (x86)\WiX Toolset v3.14\bin"
            )
            $found = $false
            foreach ($loc in $wixLocations) {
              if (Test-Path $loc) {
                Write-Host "Found existing WiX installation at $loc, adding to GITHUB_PATH"
                echo "$loc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "Installing WiX Toolset v3 via Chocolatey..."
              choco install wixtoolset -y --no-progress
              $chocoWix = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
              if (Test-Path $chocoWix) {
                echo "$chocoWix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }

      - name: Build Tauri native desktop executable & bundle installers
        run: |
          npm run tauri:build -- --verbose
        env:
          RUST_BACKTRACE: 1
          CARGO_TERM_COLOR: always

      - name: Verify and stage build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # Discover the compiled executable across target directories
          $candidatePaths = @(
            "src-tauri/target/release/apexdroid-desktop.exe",
            "src-tauri/target/release/ApexDroid.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/apexdroid-desktop.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/ApexDroid.exe"
          )

          $foundExe = $null
          foreach ($p in $candidatePaths) {
            if (Test-Path $p) {
              $foundExe = (Get-Item $p).FullName
              break
            }
          }

          if (-not $foundExe) {
            # Search recursively in src-tauri/target for the main release executable
            $search = Get-ChildItem -Path "src-tauri/target" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "bundle" -and $_.FullName -notmatch "deps" -and $_.FullName -notmatch "build" -and $_.FullName -notmatch "incremental" -and $_.Length -gt 1000000 }
            if ($search) {
              $foundExe = $search[0].FullName
            }
          }

          if (-not $foundExe) {
            Write-Error "CRITICAL: Expected executable not found in src-tauri/target release directory."
            Get-ChildItem -Path "src-tauri/target" -Recurse -Depth 3 | Select-Object FullName, Length
            exit 1
          }

          $exeItem = Get-Item $foundExe
          if ($exeItem.Length -le 1000) {
            Write-Error "CRITICAL: Generated executable is empty or suspiciously small: $($exeItem.Length) bytes"
            exit 1
          }

          Write-Host "Verified valid executable: $foundExe ($($exeItem.Length) bytes)"
          Copy-Item -Path $foundExe -Destination "artifacts/ApexDroid.exe" -Force
          Copy-Item -Path $foundExe -Destination "artifacts/apexdroid-desktop.exe" -Force

          # Stage NSIS installer if generated
          $nsisFiles = Get-ChildItem -Path "src-tauri/target" -Filter "*setup*.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "bundle[\\/]nsis" }
          if (-not $nsisFiles) {
            $nsisFiles = Get-ChildItem -Path "src-tauri/target" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "bundle[\\/]nsis" }
          }
          foreach ($file in $nsisFiles) {
            Write-Host "Found NSIS installer: $($file.FullName) ($($file.Length) bytes)"
            Copy-Item -Path $file.FullName -Destination "artifacts/$($file.Name)" -Force
          }

          # Stage MSI installer if generated
          $msiFiles = Get-ChildItem -Path "src-tauri/target" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "bundle[\\/]msi" }
          foreach ($file in $msiFiles) {
            Write-Host "Found MSI installer: $($file.FullName) ($($file.Length) bytes)"
            Copy-Item -Path $file.FullName -Destination "artifacts/$($file.Name)" -Force
          }

          Write-Host "=== Staged Artifacts in artifacts/ ==="
          Get-ChildItem -Path artifacts | Format-Table Name, Length, LastWriteTime

      - name: Upload Windows x64 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexDroid-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release for Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
